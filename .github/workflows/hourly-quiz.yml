name: Hourly quiz solver (backup + relay restarter)

on:
  schedule:
    # Best effort: GitHub may delay or skip these. relay.yml is the main driver.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-quiz
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restart the relay if it is not running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow relay.yml --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$active" = "0" ]; then
            echo "relay not running, starting it"
            gh workflow run relay.yml --ref main
          fi

      - name: Solve any unanswered rounds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 solver.py

      - name: Commit and push
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add answers
          [ -f needs_review.json ] && git add needs_review.json
          if git diff --cached --quiet; then
            echo "no new answers"
            exit 0
          fi
          git commit -m "answers: $(git diff --cached --name-only | grep -o 'round-[0-9]*' | tr '\n' ' ')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
